.Main_audio {

body {
  margin: 0;
  min-height: 100vh;
  background-color: #6a4c9c;
  background-image:
    linear-gradient(45deg, #5a3d8a 25%, transparent 25%),
    linear-gradient(-45deg, #5a3d8a 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #5a3d8a 75%),
    linear-gradient(-45deg, transparent 75%, #5a3d8a 75%);
  background-size: 60px 60px;
  background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
  animation: moveChecker 3s linear infinite;
}

@keyframes moveChecker {
  0% {
    background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
  }
  100% {
    background-position: 60px 60px, 60px 90px, 90px 30px, 30px 60px;
  }
}

  color: white;
  text-align: center;

.Bottom_Left_Text {

}


.socials-tab {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 15px;
  background: #2a1a4a;
  padding: 12px 20px;
  border-radius: 15px;
  border: 3px solid #b19cd9;
  box-shadow: 0 0 15px rgba(177, 156, 217, 0.5);
  z-index: 1000;
  color: white;
}

.socials-tab img {
  width: 52px;
  height: 52px;
  transition: transform 0.2s ease;
}

.socials-tab img:hover {
  transform: scale(1.15);
}

.Bottom_Left_Text {
  position: fixed;
  bottom: 20px;
  left: 20px;
  max-width: 300px;
  width: fit-content;   
  padding: 16px 20px;   
  border: 3px solid #b19cd9;
  border-radius: 15px;
  background-color: #2a1a4a;
  background-image:
    linear-gradient(45deg, #241640 25%, transparent 25%),

  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  box-shadow: 0 0 15px rgba(177, 156, 217, 0.5);
  color: white;
  font-family: 'Courier New', monospace;
  font-size: 24px;      
  line-height: 1.3;     
  white-space: nowrap;  
  z-index: 1000;
}

@media (max-width: 600px) {
  .Main_Text {
    max-width: 90%;
    margin: 100px auto 20px auto; /* pushes it down below the socials tab */

    gap: 8px;

  .socials-tab h2 {
    display: none;
  }

  .socials-tab img {

  .Bottom_Left_Text {
    position: static;   /* stops it from floating/overlapping */
    max-width: 90%;
    width: auto;
    white-space: normal;
    margin: 20px auto;
    font-size: 12px;
    padding: 12px;
  }

  .Main_audio {
    padding: 6px;
  }
}
